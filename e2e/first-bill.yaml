# Flows 1, 2 and 6 (User Flows): a new shop signs in and sets up, adds an unknown item while
# billing, takes cash; the bill syncs; the session and the bill survive an app restart; signing
# out and back in downloads the shop's data again. Needs the API with DEV_SIGN_IN=true.
# Run: METRO_URL=http://localhost:8081 pnpm e2e e2e/first-bill.yaml
appId: com.glitchover.billify.dev
---
- evalScript: ${output.email = 'e2e-' + Date.now() + '@billify.test'}
- clearState
- clearKeychain
- runFlow: _open-app.yaml

# 07 Welcome → 08 Sign in
- tapOn: 'I run a shop.*'
- tapOn: 'Continue'
- tapOn:
    text: 'Email.*'
    index: 1 # the input; index 0 is its label
- eraseText: 40
- inputText: ${output.email}
- pressKey: Enter # Return signs in (the keyboard covers the button)

# 09 Shop setup (a new owner: GET /v1/shops/me → 404) → 10 Camera
- extendedWaitUntil:
    visible: 'Set up your shop'
    timeout: 30000
- tapOn:
    text: 'Shop name'
    index: 1
- inputText: 'Sharma Kirana'
- tapOn:
    text: 'UPI ID'
    index: 1
- inputText: 'sharmakirana@okaxis'
- hideKeyboard
- tapOn: 'Continue'
- extendedWaitUntil:
    visible: 'Not now'
    timeout: 30000
- tapOn: 'Not now'

# 01 Billing: empty catalog, so the first search is a miss → 11 Quick add
- assertVisible: 'Sharma Kirana'
- assertVisible: 'Bill A-001'
- tapOn: 'Search items'
- inputText: 'Sugar'
- tapOn: 'No item called "Sugar".*'
- tapOn:
    text: 'Selling price'
    index: 1
- inputText: '44'
- tapOn: 'kg'
- tapOn:
    text: 'In stock now \(kg\)'
    index: 1
- inputText: '25'
- tapOn: 'New item' # closes the keyboard (hideKeyboard can't inside a form sheet)
- tapOn: 'Add to bill'
- assertVisible: 'Sugar'
- assertVisible: '₹44.00'

# 02 Checkout → 03 Bill saved
- tapOn: 'Checkout'
- tapOn: 'Cash, Collect at counter'
- tapOn: 'Mark as paid'
- assertVisible: 'Bill saved'
- assertVisible: 'A-001.*'
- tapOn: 'Start a new bill'
- assertVisible: 'Bill A-002'

# 6 Sync: the bill leaves the outbox by itself shortly after it is saved
- extendedWaitUntil:
    visible: 'Synced.*'
    timeout: 30000

# Restart: still signed in (SecureStore), shop + catalog + bill counter from SQLite
- stopApp
- runFlow: _open-app.yaml
- assertVisible: 'Bill A-002'
- tapOn: 'Search items'
- inputText: 'sug'
- assertVisible: 'Sugar.*₹44.00 / kg'
- pressKey: Enter # closes the keyboard, which hides the tab bar

# 16 More → sign out (everything synced, so nothing is lost) → sign in again
- tapOn: 'More, tab.*'
- tapOn: 'Sign out.*'
- assertVisible: 'Your shop stays on the server.*'
- tapOn: 'Sign out'
- tapOn: 'I run a shop.*'
- tapOn: 'Continue'
- tapOn:
    text: 'Email.*'
    index: 1
- eraseText: 40
- inputText: ${output.email}
- pressKey: Enter

# New phone path: the shop's data comes down before billing opens
- extendedWaitUntil:
    visible: 'Bill A-002'
    timeout: 60000
- assertVisible: 'Sharma Kirana'
- assertVisible: 'Synced.*'
- tapOn: 'Search items'
- inputText: 'sug'
- assertVisible: 'Sugar.*₹44.00 / kg'
