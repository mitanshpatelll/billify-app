# Flow 1 + 2 (User Flows): a new shop sets up, adds an unknown item while billing, takes cash,
# and the bill survives an app restart (local SQLite). Run: pnpm e2e e2e/first-bill.yaml
appId: com.glitchover.billify.dev
---
- clearState
- runFlow: _open-app.yaml

# 07 Welcome → 08 Sign in (memory-only until the auth slice)
- tapOn: 'I run a shop.*'
- tapOn: 'Continue'
- tapOn: 'Continue with Google'

# 09 Shop setup → 10 Camera
- tapOn:
    text: 'Shop name'
    index: 1 # the input; index 0 is its label
- inputText: 'Sharma Kirana'
- tapOn:
    text: 'UPI ID'
    index: 1 # the input; index 0 is its label
- inputText: 'sharmakirana@okaxis'
- hideKeyboard
- tapOn: 'Continue'
- tapOn: 'Not now'

# 01 Billing: empty catalog, so the first search is a miss → 11 Quick add
- assertVisible: 'Sharma Kirana'
- assertVisible: 'Bill A-001'
- tapOn: 'Search items'
- inputText: 'Sugar'
- tapOn: 'No item called "Sugar".*'
- tapOn:
    text: 'Selling price'
    index: 1 # the input; index 0 is its label
- inputText: '44'
- tapOn: 'kg'
- tapOn:
    text: 'In stock now \(kg\)'
    index: 1 # the input; index 0 is its label
- inputText: '25'
- tapOn: 'New item' # closes the keyboard (hideKeyboard can't inside a form sheet)
- tapOn: 'Add to bill'
- assertVisible: 'Sugar'
- assertVisible: '₹44.00'

# 02 Checkout → 03 Bill saved
- tapOn: 'Checkout'
- tapOn: 'Cash, Collect at counter'
- tapOn: 'Mark as paid'
- assertVisible: 'Bill saved'
- assertVisible: 'A-001.*'
- tapOn: 'Start a new bill'
- assertVisible: 'Bill A-002'

# Sugar is now a quick key (loose item, sold once)
- assertVisible: 'Sugar \(loose\)|Sugar'

# Restart: the shop, catalog and bill counter come back from SQLite
- stopApp
- runFlow: _open-app.yaml
- tapOn: 'Continue'
- tapOn: 'Continue with Google'
- assertVisible: 'Bill A-002'
- tapOn: 'Search items'
- inputText: 'sug'
- assertVisible: 'Sugar.*₹44.00 / kg'
