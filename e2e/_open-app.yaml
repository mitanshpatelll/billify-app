# Opens the development build on the Metro server given in METRO_URL (default: local Metro).
# disableOnboarding=1 keeps Expo's dev menu from popping up over the app on first launch.
appId: com.glitchover.billify.dev
---
- openLink: exp+billify://expo-development-client/?url=${METRO_URL || 'http://localhost:8081'}&disableOnboarding=1
# iOS may ask before an app opens its own link (always after clearState).
- runFlow:
    when:
      visible: 'Open in .*'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible: 'How will you use Billify\?|Set up your shop|Bill [A-Z]+-\d+|Runtime version.*'
    timeout: 90000
# Fallback, in case the dev menu still opens.
- runFlow:
    when:
      visible: 'This is the developer menu.*'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      visible: 'Runtime version.*'
    commands:
      - tapOn: 'Close'
- extendedWaitUntil:
    visible: 'How will you use Billify\?|Set up your shop|Bill [A-Z]+-\d+'
    timeout: 30000
