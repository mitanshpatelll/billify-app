allowBuilds:
  esbuild: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.29'
  - '@expo/fingerprint@0.20.14'
  - '@expo/inline-modules@0.1.8'
  - '@expo/local-build-cache-provider@57.0.9'
  - '@expo/prebuild-config@57.0.18'
  - babel-preset-expo@57.0.15
  - expo-modules-autolinking@57.0.15
  - expo-modules-core@57.0.22
  - expo-modules-jsi@57.1.2
  - expo@57.0.28
  - '@expo/ui@57.0.23'
  - expo-router@57.0.26
patchedDependencies:
  expo-constants@57.0.21: patches/expo-constants@57.0.21.patch
# High advisories in build tools only, with no fixed version yet (checked 15 Oct 2026; check again
# by 15 Nov 2026, or whenever expo / metro update, and remove each entry once a fix ships).
# Neither ships in the app: node-forge is Expo CLI's update code signing, braces is Metro's file
# watcher.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
